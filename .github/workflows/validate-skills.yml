name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install validation tools
        run: npm ci
      - name: Validate each skill
        run: npm run validate:skills
      - name: Check reference links
        run: |
          set -e
          failed=0
          while IFS= read -r skill_file; do
            skill_dir="${skill_file%/SKILL.md}"
            while IFS= read -r reference; do
              if [ ! -f "$skill_dir/$reference" ]; then
                echo "::error file=$skill_file::Broken reference link: $reference"
                failed=1
              fi
            done < <(grep -oE '\]\((references/[^)]+)\)' "$skill_file" | sed -E 's/.*\((references\/[^)]+)\)/\1/')
          done < <(find skills -mindepth 2 -name SKILL.md)
          exit $failed
      - name: Check installer discovery
        run: npm run validate:discovery
