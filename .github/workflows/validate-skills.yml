name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install validation tools
        run: npm ci
      - name: Validate each skill
        run: npm run validate:skills
      - name: Check local Markdown links
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import { dirname, join, resolve } from "node:path";

          function* markdownFiles(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const file = join(directory, entry.name);
              if (entry.isDirectory()) yield* markdownFiles(file);
              else if (file.endsWith(".md")) yield file;
            }
          }

          let broken = 0;
          for (const file of ["README.md", ...markdownFiles("skills")]) {
            for (const [, href] of readFileSync(file, "utf8").matchAll(/\]\(([^)]+)\)/g)) {
              if (/^(?:[a-z][a-z0-9+.-]*:|#|\/)/i.test(href)) continue;
              const target = href.split("#")[0];
              if (target && !existsSync(resolve(dirname(file), decodeURIComponent(target)))) {
                console.error(`::error file=${file}::Broken local link: ${href}`);
                broken++;
              }
            }
          }
          if (broken) process.exit(1);
          NODE
      - name: Check installer discovery
        run: npm run validate:discovery
